<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ｶﾚﾝﾀﾞｰ">
<meta name="theme-color" content="#3498db">
<title>カレンダー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #f4f6f8; color: #222;
    padding: 12px; padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  h1 { text-align: center; font-size: 18px; margin: 0 0 10px; color: #2c3e50; }

  .top-bar {
    max-width: 1500px; margin: 0 auto 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
    align-items: center; justify-content: center;
  }
  .top-bar input[type=text] {
    padding: 10px 12px; border: 1px solid #bbb; border-radius: 8px;
    font-size: 14px; flex: 1; min-width: 180px;
    -webkit-appearance: none;
  }
  #quickAddInput { background: #fffbe6; border-color: #f1c40f; }
  #searchInput   { background: #ebf5fb; border-color: #3498db; }
  .top-bar button {
    background: #f39c12; color: #fff; border: none;
    padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
    min-height: 40px;
  }
  #searchCount { font-size: 12px; color: #555; margin-left: 4px; width: 100%; text-align: center; }

  .dashboard {
    max-width: 1500px; margin: 0 auto 12px;
    background: #fff; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    padding: 10px 14px;
    border-left: 5px solid #c0392b;
  }
  .dashboard h3 { margin: 0 0 6px; font-size: 13px; color: #c0392b; }
  .dashboard .empty-msg { color: #888; font-size: 12px; }
  .timeline { display: flex; flex-wrap: wrap; gap: 6px; }
  .timeline-item {
    border-radius: 6px; padding: 7px 10px;
    font-size: 12px; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .timeline-item .time { font-weight: 600; margin-right: 4px; }
  .timeline-item .cal-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 4px;
    vertical-align: middle;
  }

  .controls {
    text-align: center; margin-bottom: 10px;
    display: flex; justify-content: center; align-items: center;
    flex-wrap: wrap; gap: 6px;
  }
  .controls button {
    background: #3498db; color: white; border: none;
    padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    min-height: 38px;
  }
  .controls button:active { filter: brightness(0.85); }
  #signout_button { background: #95a5a6; }
  #reload_button  { background: #27ae60; }
  #add_button     { background: #e67e22; }
  #calendar_list_button { background: #8e44ad; }
  .nav-group { display: inline-flex; align-items: center; gap: 4px; }
  .nav-group button { background: #34495e; padding: 9px 12px; }
  #status {
    font-size: 12px; color: #555;
    flex-basis: 100%; text-align: center; margin-top: 2px;
  }

  .calendar-container {
    display: flex; gap: 12px; justify-content: center;
    align-items: flex-start; flex-wrap: wrap;
  }
  .calendar {
    background: #fff; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    padding: 8px; flex: 1 1 0; min-width: 280px; max-width: 500px;
    width: 100%;
  }
  .calendar h2 {
    text-align: center; margin: 0 0 6px;
    font-size: 14px; color: #34495e; font-weight: 600;
  }
  .calendar.current h2 { color: #c0392b; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { padding: 4px 0; font-size: 11px; background: #ecf0f1; color: #2c3e50; border: 1px solid #dfe4e8; }
  th.sun { color: #e74c3c; }
  th.sat { color: #2980b9; }
  td {
    border: 1px solid #dfe4e8; vertical-align: top;
    height: 70px; padding: 2px; font-size: 10px;
    background: #fff; cursor: pointer; position: relative;
    overflow: hidden;
  }
  td.empty { background: #fafbfc; cursor: default; }
  td.today { background: #fff7e6; border: 2px solid #f39c12; }
  td.holiday { background: #fdf2f2; }
  .date-num { font-weight: 600; font-size: 11px; color: #2c3e50; }
  td.sun .date-num { color: #e74c3c; }
  td.sat .date-num { color: #2980b9; }
  td.holiday .date-num { color: #e74c3c; }
  .holiday-name {
    font-size: 8px; color: #c0392b; font-weight: 600;
    line-height: 1.1; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .events { margin-top: 1px; font-size: 9px; line-height: 1.25; }
  .event-item {
    border-radius: 3px; padding: 1px 4px; margin-top: 1px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    cursor: pointer;
    border-left: 3px solid rgba(0,0,0,0.25);
  }
  .event-item.allday { font-weight: 600; }
  .event-item.recurring::before { content: "🔁"; }
  .event-item.search-hit { box-shadow: 0 0 0 2px #f1c40f; }
  .event-item.search-miss { opacity: 0.25; }
  .footer-note { text-align: center; font-size: 11px; color: #888; margin-top: 12px; }

  @media (max-width: 700px) {
    body { padding: 8px; }
    h1 { font-size: 16px; margin-bottom: 6px; }
    .calendar { min-width: 100%; padding: 6px; }
    td { height: 56px; padding: 1px; font-size: 9px; }
    .date-num { font-size: 11px; }
    .events { font-size: 8px; }
    .event-item { font-size: 9px; padding: 1px 3px; }
    .calendar:not(.current) { display: none; }
  }
  @media (min-width: 701px) and (max-width: 1199px) {
    .calendar:nth-child(1) { display: none; }
    .calendar { min-width: 45%; }
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 10px;
    width: 100%; max-width: 480px; max-height: 90vh;
    overflow-y: auto; padding: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    -webkit-overflow-scrolling: touch;
  }
  .modal h3 {
    margin: 0 0 10px; color: #2c3e50; font-size: 16px;
    border-bottom: 2px solid #ecf0f1; padding-bottom: 6px;
  }
  .modal .row { margin: 8px 0; font-size: 14px; }
  .modal .row label {
    display: block; font-weight: 600; color: #555;
    margin-bottom: 3px; font-size: 12px;
  }
  .modal input[type="text"], .modal input[type="date"],
  .modal input[type="time"], .modal textarea, .modal select {
    width: 100%; padding: 9px 10px; border: 1px solid #ccc;
    border-radius: 6px; font-size: 15px; font-family: inherit;
    -webkit-appearance: none; background: #fff;
  }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .row.flex { display: flex; gap: 8px; }
  .modal .row.flex > div { flex: 1; }
  .modal .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .modal .checkbox-row input { width: auto; transform: scale(1.2); }
  .modal-actions {
    margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end;
    flex-wrap: wrap;
  }
  .modal-actions button {
    padding: 10px 16px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; min-height: 42px;
  }
  .btn-primary { background: #3498db; color: #fff; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-danger  { background: #e74c3c; color: #fff; }
  .btn-secondary { background: #95a5a6; color: #fff; }
  .meta-info {
    background: #f8f9fa; padding: 8px 10px; border-radius: 5px;
    margin: 8px 0; font-size: 13px; color: #555;
  }
  .meta-info b { color: #2c3e50; }
  .preview-box {
    background: #fef9e7; border: 1px solid #f1c40f;
    padding: 7px 10px; border-radius: 6px; font-size: 12px;
    margin: 0 auto 8px; max-width: 1500px; display: none;
  }
  .preview-box.show { display: block; }

  /* === カレンダーリスト === */
  .calendar-list-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px; border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  .calendar-list-item:last-child { border-bottom: none; }
  .calendar-list-item .swatch {
    width: 18px; height: 18px; border-radius: 4px;
    flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15);
  }
  .calendar-list-item .name { flex: 1; font-size: 14px; color: #2c3e50; }
  .calendar-list-item .role { font-size: 10px; color: #888; }
  .calendar-list-item input[type=checkbox] {
    width: 20px; height: 20px;
  }
</style>
</head>
<body>
  <h1>📅 秘書カレンダー</h1>

  <div class="top-bar">
    <input type="text" id="quickAddInput" placeholder="🪄 例: 明日10時 ミーティング" enterkeyhint="done">
    <button id="quickAddSubmit">追加</button>
    <input type="text" id="searchInput" placeholder="🔍 予定を検索">
    <span id="searchCount"></span>
  </div>
  <div class="preview-box" id="quickPreview"></div>

  <div class="dashboard">
    <h3>📌 今日の予定（<span id="todayDateLabel"></span>）</h3>
    <div id="todayEvents" class="timeline"></div>
  </div>

  <div class="controls">
    <button id="authorize_button" style="display:none;">サインイン</button>
    <button id="signout_button"   style="display:none;">サインアウト</button>
    <button id="reload_button"    style="display:none;">🔄</button>
    <button id="add_button"       style="display:none;">+ 追加</button>
    <button id="calendar_list_button" style="display:none;">📅 カレンダー</button>
    <span class="nav-group">
      <button id="prev_button">←</button>
      <button id="today_button">今日</button>
      <button id="next_button">→</button>
    </span>
    <span id="status">読み込み中...</span>
  </div>

  <div class="calendar-container" id="calendarContainer"></div>
  <div class="footer-note" id="footerNote"></div>

  <!-- カレンダーリストモーダル -->
  <div class="modal-overlay" id="calListOverlay">
    <div class="modal">
      <h3>📅 表示するカレンダー</h3>
      <div id="calList"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="calListClose">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="modal">
      <h3 id="detailTitle">予定の詳細</h3>
      <div class="meta-info" id="detailMeta"></div>
      <div class="row" id="detailCalendarRow">
        <label>カレンダー</label>
        <div id="detailCalendar" style="font-size:13px;"></div>
      </div>
      <div class="row">
        <label>説明</label>
        <div id="detailDescription" style="white-space:pre-wrap; font-size:13px; color:#444;"></div>
      </div>
      <div class="row" id="detailLocationRow" style="display:none;">
        <label>場所</label>
        <div id="detailLocation" style="font-size:13px; color:#444;"></div>
      </div>
      <div class="row" id="detailRecurrenceRow" style="display:none;">
        <label>繰り返し</label>
        <div id="detailRecurrence" style="font-size:13px; color:#444;"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-danger"  id="detailDelete">削除</button>
        <button class="btn-primary" id="detailEdit">編集</button>
        <button class="btn-secondary" id="detailClose">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="modal-overlay" id="editOverlay">
    <div class="modal">
      <h3 id="editTitle">予定を追加</h3>
      <input type="hidden" id="editEventId">
      <input type="hidden" id="editOriginalCalendarId">
      <div class="row">
        <label>カレンダー *</label>
        <select id="editCalendarSelect"></select>
      </div>
      <div class="row">
        <label>タイトル *</label>
        <input type="text" id="editTitleInput" placeholder="例: 打ち合わせ">
      </div>
      <div class="row checkbox-row">
        <input type="checkbox" id="editAllDay">
        <label for="editAllDay" style="margin:0;">終日イベント</label>
      </div>
      <div class="row flex">
        <div>
          <label>開始日 *</label>
          <input type="date" id="editStartDate">
        </div>
        <div id="editStartTimeWrap">
          <label>開始時刻</label>
          <input type="time" id="editStartTime">
        </div>
      </div>
      <div class="row flex">
        <div>
          <label>終了日</label>
          <input type="date" id="editEndDate">
        </div>
        <div id="editEndTimeWrap">
          <label>終了時刻</label>
          <input type="time" id="editEndTime">
        </div>
      </div>
      <div class="row">
        <label>場所</label>
        <input type="text" id="editLocation" placeholder="例: 会議室A">
      </div>
      <div class="row">
        <label>繰り返し</label>
        <select id="editRecurrence">
          <option value="">なし</option>
          <option value="DAILY">毎日</option>
          <option value="WEEKLY">毎週同曜日</option>
          <option value="MONTHLY">毎月同日</option>
          <option value="YEARLY">毎年同月日</option>
        </select>
      </div>
      <div class="row">
        <label>説明・メモ</label>
        <textarea id="editDescription" placeholder="詳細メモ"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="editCancel">キャンセル</button>
        <button class="btn-success"   id="editSave">保存</button>
      </div>
    </div>
  </div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
  const CLIENT_ID = "260474228401-lcmfs06c43s13mg14erkaqhrq91seghv.apps.googleusercontent.com";
  const API_KEY   = "AIzaSyC8TLedI_AhNEvHJH0a6vaR1v1qIsNT-2U";
  const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";
  const SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly";

  let tokenClient, gapiInited = false, gisInited = false, isAuthed = false;
  const today = new Date();
  let displayBaseDate = new Date(today.getFullYear(), today.getMonth(), 1);
  let eventsByDate = {}, rawEvents = {};
  let holidays = {};
  let searchKeyword = "";
  let calendars = []; // [{id, summary, primary, accessRole, backgroundColor, foregroundColor}]
  let visibleCalendarIds = new Set(); // 永続化される

  const VISIBLE_KEY = "hisho_visible_cals_v1";

  const weekdays = ["日","月","火","水","木","金","土"];
  const $ = (id) => document.getElementById(id);
  const setStatus = (msg) => $("status").textContent = msg;
  const pad = (n) => String(n).padStart(2, "0");
  const dateKey = (y, m, d) => `${y}-${pad(m+1)}-${pad(d)}`;
  const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays = (yyyymmdd, days) => {
    const d = new Date(yyyymmdd + "T00:00:00");
    d.setDate(d.getDate() + days);
    return fmtDate(d);
  };
  function isLightColor(hex) {
    if (!hex) return false;
    const c = hex.replace("#", "");
    const r = parseInt(c.substr(0,2), 16);
    const g = parseInt(c.substr(2,2), 16);
    const b = parseInt(c.substr(4,2), 16);
    return (r*299 + g*587 + b*114) / 1000 > 155;
  }
  function getCalById(id) {
    return calendars.find(c => c.id === id);
  }
  function getCalColor(id) {
    const c = getCalById(id);
    return c ? (c.backgroundColor || "#3498db") : "#3498db";
  }
  function isCalEditable(cal) {
    return cal && (cal.accessRole === "owner" || cal.accessRole === "writer");
  }

  async function loadHolidays() {
    try {
      const r = await fetch("https://holidays-jp.github.io/api/v1/date.json");
      if (!r.ok) throw new Error(r.status);
      holidays = await r.json();
    } catch(e) { console.warn("祝日取得失敗", e); }
  }

  function loadVisiblePref() {
    try {
      const v = localStorage.getItem(VISIBLE_KEY);
      if (v) visibleCalendarIds = new Set(JSON.parse(v));
    } catch(e) {}
  }
  function saveVisiblePref() {
    try {
      localStorage.setItem(VISIBLE_KEY, JSON.stringify([...visibleCalendarIds]));
    } catch(e) {}
  }

  // ===== クイック追加パース =====
  function parseQuickAdd(text) {
    text = text.trim();
    let date = null, startTime = null, endTime = null, allDay = true;
    const wkDayMap = {"日":0,"月":1,"火":2,"水":3,"木":4,"金":5,"土":6};
    let m;
    if ((m = text.match(/来週([日月火水木金土])曜?/))) {
      const target = wkDayMap[m[1]];
      const d = new Date(today);
      const diff = (target - d.getDay() + 7) % 7 || 7;
      d.setDate(d.getDate() + diff);
      date = d; text = text.replace(m[0], "").trim();
    } else if ((m = text.match(/今週([日月火水木金土])曜?/))) {
      const target = wkDayMap[m[1]];
      const d = new Date(today);
      const diff = (target - d.getDay() + 7) % 7;
      d.setDate(d.getDate() + diff);
      date = d; text = text.replace(m[0], "").trim();
    } else if (/明後日/.test(text)) {
      date = new Date(today); date.setDate(date.getDate() + 2);
      text = text.replace(/明後日/, "").trim();
    } else if (/明日/.test(text)) {
      date = new Date(today); date.setDate(date.getDate() + 1);
      text = text.replace(/明日/, "").trim();
    } else if (/今日/.test(text)) {
      date = new Date(today);
      text = text.replace(/今日/, "").trim();
    }
    if (!date && (m = text.match(/(\d{1,2})\/(\d{1,2})/))) {
      date = new Date(today.getFullYear(), parseInt(m[1])-1, parseInt(m[2]));
      text = text.replace(m[0], "").trim();
    } else if (!date && (m = text.match(/(\d{1,2})月(\d{1,2})日?/))) {
      date = new Date(today.getFullYear(), parseInt(m[1])-1, parseInt(m[2]));
      text = text.replace(m[0], "").trim();
    }
    if ((m = text.match(/(\d{1,2}):(\d{2})\s*[-〜~]\s*(\d{1,2}):(\d{2})/))) {
      startTime = `${pad(m[1])}:${m[2]}`; endTime = `${pad(m[3])}:${m[4]}`;
      allDay = false; text = text.replace(m[0], "").trim();
    } else if ((m = text.match(/(\d{1,2})時(\d{1,2})?分?\s*[-〜~]\s*(\d{1,2})時(\d{1,2})?分?/))) {
      startTime = `${pad(m[1])}:${m[2] ? pad(m[2]) : "00"}`;
      endTime   = `${pad(m[3])}:${m[4] ? pad(m[4]) : "00"}`;
      allDay = false; text = text.replace(m[0], "").trim();
    } else if ((m = text.match(/(\d{1,2})\s*[-〜~]\s*(\d{1,2})時/))) {
      startTime = `${pad(m[1])}:00`; endTime = `${pad(m[2])}:00`;
      allDay = false; text = text.replace(m[0], "").trim();
    } else if ((m = text.match(/(\d{1,2}):(\d{2})/))) {
      startTime = `${pad(m[1])}:${m[2]}`;
      const eh = parseInt(m[1]) + 1;
      endTime = `${pad(eh > 23 ? 23 : eh)}:${m[2]}`;
      allDay = false; text = text.replace(m[0], "").trim();
    } else if ((m = text.match(/(\d{1,2})時(\d{1,2})?分?/))) {
      startTime = `${pad(m[1])}:${m[2] ? pad(m[2]) : "00"}`;
      const eh = parseInt(m[1]) + 1;
      endTime = `${pad(eh > 23 ? 23 : eh)}:${m[2] ? pad(m[2]) : "00"}`;
      allDay = false; text = text.replace(m[0], "").trim();
    }
    let location = "";
    if ((m = text.match(/[@＠]([^\s]+)/))) {
      location = m[1]; text = text.replace(m[0], "").trim();
    }
    if (!date) date = new Date(today);
    return { date, startTime, endTime, allDay, location, title: text.trim() };
  }
  function showQuickPreview() {
    const text = $("quickAddInput").value;
    const box  = $("quickPreview");
    if (!text.trim()) { box.classList.remove("show"); return; }
    const p = parseQuickAdd(text);
    if (!p.title) { box.classList.remove("show"); return; }
    let line = `📅 ${fmtDate(p.date)} (${weekdays[p.date.getDay()]}) `;
    line += p.allDay ? "終日 " : `${p.startTime}〜${p.endTime} `;
    line += `｜ ${p.title}`;
    if (p.location) line += ` @${p.location}`;
    box.textContent = "🔍 " + line;
    box.classList.add("show");
  }
  $("quickAddInput").addEventListener("input", showQuickPreview);
  $("quickAddInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); $("quickAddSubmit").click(); }
  });
  $("quickAddSubmit").onclick = () => {

  // ===== 予定取得（複数カレンダー） =====
  async function fetchEvents() {
    try {
      const baseY = displayBaseDate.getFullYear();
      const baseM = displayBaseDate.getMonth();
      const timeMin = new Date(baseY, baseM - 1, 1, 0, 0, 0).toISOString();
      const timeMax = new Date(baseY, baseM + 2, 0, 23, 59, 59).toISOString();
      eventsByDate = {}; rawEvents = {};
      const targets = calendars.filter(c => visibleCalendarIds.has(c.id));
      let totalCount = 0;
      const results = await Promise.all(targets.map(c =>
        gapi.client.calendar.events.list({
          calendarId: c.id, timeMin, timeMax,
          showDeleted: false, singleEvents: true, orderBy: "startTime",
          maxResults: 1000,
        }).then(r => ({cal: c, items: r.result.items || []})).catch(err => {
          console.warn("取得失敗", c.summary, err);
          return {cal: c, items: []};
        })
      ));
      results.forEach(({cal, items}) => {
        items.forEach(ev => {
          ev._calendarId = cal.id;
          ev._calendarName = cal.summary;
          ev._calendarColor = cal.backgroundColor || "#3498db";
          ev._calendarFg    = cal.foregroundColor || "#ffffff";
          rawEvents[cal.id + "::" + ev.id] = ev;
          const summary = ev.summary || "(無題)";
          const isRecurring = !!ev.recurringEventId;
          const eventKey = cal.id + "::" + ev.id;
          if (ev.start.date) {
            const start = new Date(ev.start.date + "T00:00:00");
            const end   = new Date(ev.end.date   + "T00:00:00");
            for (let d = new Date(start); d < end; d.setDate(d.getDate()+1)) {
              const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
              (eventsByDate[k] = eventsByDate[k] || []).push({
                key: eventKey, id: ev.id, calendarId: cal.id,
                title: summary, time: "", allDay: true, recurring: isRecurring,
                color: cal.backgroundColor, fg: cal.foregroundColor,
              });
            }
          } else {
            const start = new Date(ev.start.dateTime);
            const time = pad(start.getHours()) + ":" + pad(start.getMinutes());
            const k = dateKey(start.getFullYear(), start.getMonth(), start.getDate());
            (eventsByDate[k] = eventsByDate[k] || []).push({
              key: eventKey, id: ev.id, calendarId: cal.id,
              title: summary, time, allDay: false, recurring: isRecurring,
              color: cal.backgroundColor, fg: cal.foregroundColor,
            });
          }
          totalCount++;
        });
      });
      // 各日のイベントを時刻でソート
      Object.keys(eventsByDate).forEach(k => {
        eventsByDate[k].sort((a,b) => {
          if (a.allDay && !b.allDay) return -1;
          if (!a.allDay && b.allDay) return 1;
          return (a.time || "").localeCompare(b.time || "");
        });
      });
      setStatus(`${totalCount} 件の予定（${targets.length}カレンダー）`);
      renderAllCalendars();
      renderTodayDashboard();
    } catch (err) {
      console.error(err);
      setStatus("取得エラー: " + (err.result?.error?.message || err.message || "unknown"));
    }
  }

  function isSearchHit(eventObj) {
    if (!searchKeyword) return null;
    const ev = rawEvents[eventObj.key];
    if (!ev) return false;
    const target = ((ev.summary||"") + " " + (ev.location||"") + " " + (ev.description||"")).toLowerCase();
    return target.includes(searchKeyword);
  }

  function buildCalendar(year, month, isCurrent) {
    const wrapper = document.createElement("div");
    wrapper.className = "calendar" + (isCurrent ? " current" : "");
    const title = document.createElement("h2");
    title.textContent = `${year}年 ${month + 1}月`;
    wrapper.appendChild(title);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    weekdays.forEach((w, i) => {
      const th = document.createElement("th");
      th.textContent = w;
      if (i === 0) th.classList.add("sun");
      if (i === 6) th.classList.add("sat");
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let day = 1;
    for (let row = 0; row < 6; row++) {
      const tr = document.createElement("tr");
      let rowHasDate = false;
      for (let col = 0; col < 7; col++) {
        const td = document.createElement("td");
        if ((row === 0 && col < firstDay) || day > daysInMonth) {
          td.classList.add("empty");
        } else {
          rowHasDate = true;
          if (col === 0) td.classList.add("sun");
          if (col === 6) td.classList.add("sat");
          if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
            td.classList.add("today");
          }
          const k = dateKey(year, month, day);
          if (holidays[k]) td.classList.add("holiday");
          const tY = year, tM = month, tD = day;
          td.addEventListener("click", (e) => {
            if (e.target.closest(".event-item")) return;
            if (!isAuthed) { setStatus("先にサインインしてください"); return; }
            openAddDialog(new Date(tY, tM, tD));
          });
          const numDiv = document.createElement("div");
          numDiv.className = "date-num";
          numDiv.textContent = day;
          td.appendChild(numDiv);
          if (holidays[k]) {
            const h = document.createElement("div");
            h.className = "holiday-name";
            h.textContent = holidays[k];
            td.appendChild(h);
          }
          const evWrap = document.createElement("div");
          evWrap.className = "events";
          if (eventsByDate[k]) {
            eventsByDate[k].forEach(ev => {
              const item = document.createElement("div");
              const cls = ["event-item"];
              if (ev.allDay) cls.push("allday");
              if (ev.recurring) cls.push("recurring");
              const hit = isSearchHit(ev);
              if (hit === true)  cls.push("search-hit");
              if (hit === false) cls.push("search-miss");
              item.className = cls.join(" ");
              const bg = ev.color || "#3498db";
              item.style.background = bg;
              item.style.color = isLightColor(bg) ? "#222" : "#fff";
              item.style.borderLeftColor = isLightColor(bg) ? "rgba(0,0,0,0.3)" : "rgba(255,255,255,0.5)";
              const label = (ev.time ? ev.time + " " : "") + ev.title;
              item.title = label;
              item.textContent = label;
              item.addEventListener("click", (e) => {
                e.stopPropagation();
                openDetailDialog(ev.key);
              });
              evWrap.appendChild(item);
            });
          }
          td.appendChild(evWrap);
          day++;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
      if (!rowHasDate && day > daysInMonth) break;
    }
    table.appendChild(tbody);
    wrapper.appendChild(table);
    return wrapper;
  }
  function renderAllCalendars() {
    const container = $("calendarContainer");
    container.innerHTML = "";
    const baseY = displayBaseDate.getFullYear();
    const baseM = displayBaseDate.getMonth();
    const months = [
      { y: baseY, m: baseM - 1, current: false },
      { y: baseY, m: baseM,     current: true  },
      { y: baseY, m: baseM + 1, current: false },
    ];
    months.forEach(({y, m, current}) => {
      const d = new Date(y, m, 1);
      container.appendChild(buildCalendar(d.getFullYear(), d.getMonth(), current));
    });
    $("footerNote").textContent =
      `本日: ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 (${weekdays[today.getDay()]})`;
    if (searchKeyword) {
      let hit = 0;
      Object.values(eventsByDate).forEach(arr => arr.forEach(ev => {
        if (isSearchHit(ev) === true) hit++;
      }));
      $("searchCount").textContent = `${hit}件ヒット`;
    } else {
      $("searchCount").textContent = "";
    }
  }

  function renderTodayDashboard() {

      `${today.getMonth()+1}/${today.getDate()} ${weekdays[today.getDay()]}` +

    wrap.innerHTML = "";

      wrap.innerHTML = '<div class="empty-msg">今日の予定はありません ✨</div>';

    items.forEach(ev => {

  function openEditDialog(key) {

    $("editTitle").textContent = "予定を編集";

      $("editStartDate").value = fmtDate(s);
      $("editEndDate").value   = fmtDate(e);
      $("editStartTime").value = pad(s.getHours()) + ":" + pad(s.getMinutes());
      $("editEndTime").value   = pad(e.getHours()) + ":" + pad(e.getMinutes());

  function toggleAllDayInputs() {
    const isAllDay = $("editAllDay").checked;

  $("editSave").onclick = async () => {
    const summary = $("editTitleInput").value.trim();
    if (!summary) { alert("タイトルを入力してください"); return; }
    const isAllDay = $("editAllDay").checked;
    const sd = $("editStartDate").value;
    const ed = $("editEndDate").value || sd;
    if (!sd) { alert("開始日を入力してください"); return; }
    const targetCalId = $("editCalendarSelect").value;
    const origCalId   = $("editOriginalCalendarId").value;
    const eventId     = $("editEventId").value;

    const resource = {
      summary,
      location: $("editLocation").value.trim() || undefined,
      description: $("editDescription").value.trim() || undefined,
    };
    if (isAllDay) {
      resource.start = { date: sd };
      resource.end   = { date: addDays(ed, 1) };
    } else {
      const st = $("editStartTime").value || "00:00";
      const et = $("editEndTime").value   || "01:00";
      resource.start = { dateTime: new Date(`${sd}T${st}:00`).toISOString() };
      resource.end   = { dateTime: new Date(`${ed}T${et}:00`).toISOString() };
    }
    const freq = $("editRecurrence").value;
    if (freq) resource.recurrence = [`RRULE:FREQ=${freq}`];

    try {
      setStatus(eventId ? "更新中..." : "追加中...");
      if (eventId) {
        if (origCalId !== targetCalId) {
          // カレンダー間移動：moveを試す
          await gapi.client.calendar.events.move({
            calendarId: origCalId, eventId, destination: targetCalId,
          });
          // 移動後にupdateで内容更新
          await gapi.client.calendar.events.update({
            calendarId: targetCalId, eventId, resource,
          });
        } else {
          await gapi.client.calendar.events.update({
            calendarId: targetCalId, eventId, resource,
          });
        }
      } else {
        await gapi.client.calendar.events.insert({
          calendarId: targetCalId, resource,
        });
      }
      $("editOverlay").classList.remove("show");
      setStatus("保存完了");
      await fetchEvents();
    } catch (err) {
      console.error(err);
      setStatus("保存エラー: " + (err.result?.error?.message || err.message));
    }
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      $("detailOverlay").classList.remove("show");
      $("editOverlay").classList.remove("show");
      $("calListOverlay").classList.remove("show");
    }
  });
</script>
</body>
</html>
