<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>hisho01 - 3か月カレンダー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 20px;
    color: #2c3e50;
  }
  .calendar-container {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .calendar {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    padding: 12px;
    flex: 1 1 0;
    min-width: 360px;
    max-width: 520px;
  }
  .calendar h2 {
    text-align: center;
    margin: 0 0 10px;
    font-size: 16px;
    color: #34495e;
    font-weight: 600;
  }
  .calendar.current h2 {
    color: #c0392b;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th {
    padding: 6px 0;
    font-size: 12px;
    background: #ecf0f1;
    color: #2c3e50;
    border: 1px solid #dfe4e8;
  }
  th.sun { color: #e74c3c; }
  th.sat { color: #2980b9; }
  td {
    border: 1px solid #dfe4e8;
    vertical-align: top;
    height: 70px;
    padding: 4px;
    font-size: 12px;
    background: #fff;
  }
  td.empty { background: #fafbfc; }
  td.today {
    background: #fff7e6;
    border: 2px solid #f39c12;
  }
  .date-num {
    font-weight: 600;
    font-size: 13px;
    color: #2c3e50;
  }
  td.sun .date-num { color: #e74c3c; }
  td.sat .date-num { color: #2980b9; }
  .events {
    margin-top: 3px;
    font-size: 10px;
    line-height: 1.3;
    color: #555;
  }
  .event-item {
    background: #d6eaf8;
    color: #1b4f72;
    border-radius: 3px;
    padding: 1px 3px;
    margin-top: 2px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #888;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <h1>hisho01 — 3か月カレンダー</h1>
  <div class="calendar-container" id="calendarContainer"></div>
  <div class="footer-note" id="footerNote"></div>

<script>
  // ====== 設定 ======
  // 今日の日付を取得（基準日）
  const today = new Date();
  const baseYear = today.getFullYear();
  const baseMonth = today.getMonth(); // 0始まり

  // イベントデータ（後でGoogle Calendar APIに置き換え予定）
  // フォーマット: "YYYY-MM-DD": [{title: "...", time: "..."}]
  const events = {
    // サンプル例（必要に応じて削除/編集）
    // "2026-05-07": [{title: "サンプル予定", time: "10:00"}]
  };

  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

  function pad(n) { return String(n).padStart(2, "0"); }

  function formatDateKey(y, m, d) {
    return `${y}-${pad(m+1)}-${pad(d)}`;
  }

  function buildCalendar(year, month, isCurrent) {
    const wrapper = document.createElement("div");
    wrapper.className = "calendar" + (isCurrent ? " current" : "");

    const title = document.createElement("h2");
    title.textContent = `${year}年 ${month + 1}月`;
    wrapper.appendChild(title);

    const table = document.createElement("table");

    // ヘッダー（曜日）
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    weekdays.forEach((w, i) => {
      const th = document.createElement("th");
      th.textContent = w;
      if (i === 0) th.classList.add("sun");
      if (i === 6) th.classList.add("sat");
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    // 本体
    const tbody = document.createElement("tbody");
    const firstDay = new Date(year, month, 1).getDay(); // 月初の曜日
    const daysInMonth = new Date(year, month + 1, 0).getDate(); // 月末の日

    let day = 1;
    for (let row = 0; row < 6; row++) {
      const tr = document.createElement("tr");
      let rowHasDate = false;
      for (let col = 0; col < 7; col++) {
        const td = document.createElement("td");
        if ((row === 0 && col < firstDay) || day > daysInMonth) {
          td.classList.add("empty");
        } else {
          rowHasDate = true;
          if (col === 0) td.classList.add("sun");
          if (col === 6) td.classList.add("sat");

          // 今日チェック
          if (year === today.getFullYear() &&
              month === today.getMonth() &&
              day === today.getDate()) {
            td.classList.add("today");
          }

          const numDiv = document.createElement("div");
          numDiv.className = "date-num";
          numDiv.textContent = day;
          td.appendChild(numDiv);

          // イベント表示エリア
          const evWrap = document.createElement("div");
          evWrap.className = "events";
          const key = formatDateKey(year, month, day);
          if (events[key]) {
            events[key].forEach(ev => {
              const item = document.createElement("div");
              item.className = "event-item";
              item.title = (ev.time ? ev.time + " " : "") + ev.title;
              item.textContent = (ev.time ? ev.time + " " : "") + ev.title;
              evWrap.appendChild(item);
            });
          }
          td.appendChild(evWrap);

          day++;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
      if (!rowHasDate && day > daysInMonth) break;
    }

    table.appendChild(tbody);
    wrapper.appendChild(table);
    return wrapper;
  }

  // 先月・今月・来月を生成
  const container = document.getElementById("calendarContainer");
  const months = [
    { y: baseYear, m: baseMonth - 1, current: false },
    { y: baseYear, m: baseMonth,     current: true  },
    { y: baseYear, m: baseMonth + 1, current: false },
  ];

  months.forEach(({y, m, current}) => {
    // 月の繰り上げ・繰り下げを正規化
    const d = new Date(y, m, 1);
    container.appendChild(buildCalendar(d.getFullYear(), d.getMonth(), current));
  });

  // フッターに今日の日付を表示
  const fn = document.getElementById("footerNote");
  fn.textContent = `本日: ${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 (${weekdays[today.getDay()]})`;
</script>
</body>
</html>
